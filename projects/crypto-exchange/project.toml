# Скринер крипто-биржи: код, проверки и отчёты лежат в /mnt/data/projects/crypto-exchange.

[project]
name = "crypto-exchange"
path = "/mnt/data/projects/crypto-exchange"
category = "research"
description = "Скринер крипто-биржи: микроструктура стакана, поток сделок, телеграм-сигналы — что подтвердилось и что нет"

# Список тот же, что в .gitignore проекта, и по той же причине: индексировать
# имеет смысл код, проверки и отчёты, а не выгрузки и собранные страницы.
# `.env` здесь обязателен: в нём ключи биржи, и в базу знаний они попасть не
# должны. Каталоги на `.` индексатор пропускает сам, но файл `.env` — нет.
#
# `tools/news/*.json` — измерения (объявления о листингах, дельтинги, каталог
# монет), а не текст. Один `catalog48_all.json` давал 16 022 фрагмента из
# 20 903 по всему проекту; скрипты рядом с ним — наоборот, самое ценное, и
# они остаются. Проверять dry-run'ом: правило из базы знаний — искать
# файл-гигант до индексации, а не после.
exclude = [".env", "*.key", "*.pem", "*.p12", "data", "docs/tiger",
           "tools/prototype", "tools/news/*.json", "*.parquet",
           "*.csv", "*.jsonl"]
