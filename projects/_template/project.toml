# Шаблон описания проекта. Скопируйте в папку проекта и поправьте.
#
# name и path можно не указывать: по умолчанию имя берётся из имени папки,
# а файлы — оттуда же.

[project]
name = "имя-проекта"
category = "docs"
description = "Одна строка о том, что это за проект"

# Если файлы лежат не в этой папке, а в другом месте — раскомментируйте:
# path = "~/путь/к/проекту"

# Что не индексировать: шаблоны в стиле .gitignore, сравниваются с путём от
# корня проекта. Каталоги build/, dist/, .git/ и подобные индексатор и так
# пропускает по имени; сюда пишите своё — распакованные архивы, выгрузки,
# снимки экрана, собранные одним файлом страницы.
# exclude = ["decoded", "dumps/*.csv", "src/taxi-app.html"]
